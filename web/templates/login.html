{{define "content"}}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle)">
  <div class="card card-pad" style="width:340px">
    <div class="flex items-center gap-2 mb-4">{{icon "bug" "icon"}} <h1>Errgotrack</h1></div>
    {{if .Error}}<div class="badge badge-error mb-3">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="field">
        <label>Username</label>
        <input class="w-full" type="text" name="username" autofocus required>
      </div>
      <div class="field">
        <label>Password</label>
        <input class="w-full" type="password" name="password" required>
      </div>
      <button class="btn btn-primary w-full" type="submit" style="justify-content:center">Sign in</button>
    </form>
  </div>
</div>
{{end}}
