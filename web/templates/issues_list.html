{{define "pagetitle"}}Issues{{end}}
{{define "content"}}
<div class="card card-pad mb-4">
  <form class="flex items-center gap-3" hx-get="/issues" hx-target="#issues-table-wrap" hx-push-url="true">
    <input type="search" name="q" placeholder="Search title or exception type" value="{{.Filter.Query}}" style="min-width:220px">
    <select name="project">
      <option value="">All projects</option>
      {{range .Projects}}<option value="{{.ID}}" {{if eq $.Filter.ProjectID .ID}}selected{{end}}>{{.Name}}</option>{{end}}
    </select>
    <select name="environment">
      <option value="">All environments</option>
      {{range .Environments}}<option value="{{.}}" {{if eq $.Filter.Environment .}}selected{{end}}>{{.}}</option>{{end}}
    </select>
    <select name="status">
      <option value="">Any status</option>
      <option value="unresolved" {{if eq .Filter.Status "unresolved"}}selected{{end}}>Unresolved</option>
      <option value="resolved" {{if eq .Filter.Status "resolved"}}selected{{end}}>Resolved</option>
      <option value="ignored" {{if eq .Filter.Status "ignored"}}selected{{end}}>Ignored</option>
    </select>
    <select name="sort">
      <option value="last_seen" {{if eq .Filter.OrderBy "last_seen"}}selected{{end}}>Recent</option>
      <option value="event_count" {{if eq .Filter.OrderBy "event_count"}}selected{{end}}>Frequency</option>
      <option value="first_seen" {{if eq .Filter.OrderBy "first_seen"}}selected{{end}}>First seen</option>
    </select>
    <button class="btn" type="submit">{{icon "filter" "icon"}} Filter</button>
  </form>
</div>
<div id="issues-table-wrap">
  {{template "issues_table" .}}
</div>
{{end}}
