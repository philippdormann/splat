{{define "pagetitle"}}New project{{end}}
{{define "content"}}
<div class="card card-pad" style="max-width:480px">
  {{if .Error}}<div class="badge badge-error mb-3">{{.Error}}</div>{{end}}
  <form method="post" action="/projects/new">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="field">
      <label>Name</label>
      <input class="w-full" type="text" name="name" required placeholder="My Django App">
    </div>
    <div class="field">
      <label>Slug</label>
      <input class="w-full" type="text" name="slug" required placeholder="my-django-app" pattern="[a-z0-9-]+">
    </div>
    <div class="field">
      <label>Platform</label>
      <select class="w-full" name="platform">
        {{range .Platforms}}<option value="{{.ID}}">{{.Label}}</option>{{end}}
      </select>
    </div>
    <div class="field">
      <label>Default environment</label>
      <input class="w-full" type="text" name="default_environment" value="production">
    </div>
    <div class="field">
      <label>Retention (days)</label>
      <input class="w-full" type="number" name="retention_days" value="90" min="1">
    </div>
    <button class="btn btn-primary" type="submit">Create project</button>
  </form>
</div>
{{end}}
