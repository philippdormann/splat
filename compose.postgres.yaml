# Errgotrack with the optional Postgres backend: app + database, still one
# compose file. SQLite stays the default - only use this if you outgrow it.
#
#   cp .env.example .env   # set secrets, admin credentials + POSTGRES_PASSWORD
#   docker compose -f compose.postgres.yaml up -d --build
services:
  errgotrack:
    build: .
    image: ghcr.io/philippdormann/errgotrack:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - errgotrack-data:/data
    environment:
      ERRGOTRACK_PUBLIC_URL: ${ERRGOTRACK_PUBLIC_URL:-https://errors.example.com}
      ERRGOTRACK_ADMIN_USERNAME: ${ERRGOTRACK_ADMIN_USERNAME}
      ERRGOTRACK_ADMIN_PASSWORD: ${ERRGOTRACK_ADMIN_PASSWORD}
      ERRGOTRACK_SESSION_SECRET: ${ERRGOTRACK_SESSION_SECRET}
      ERRGOTRACK_DB_DRIVER: postgres
      ERRGOTRACK_DATABASE_URL: postgres://${POSTGRES_USER:-errgotrack}:${POSTGRES_PASSWORD:-errgotrack}@postgres:5432/${POSTGRES_DB:-errgotrack}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/errgotrack", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-errgotrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-errgotrack}
      POSTGRES_DB: ${POSTGRES_DB:-errgotrack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-errgotrack} -d $${POSTGRES_DB:-errgotrack}"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  errgotrack-data:
  postgres-data:
