# Splat with the optional Postgres backend: app + database, still one
# compose file. SQLite stays the default - only use this if you outgrow it.
#
#   cp .env.example .env   # set secrets, admin credentials + POSTGRES_PASSWORD
#   docker compose -f compose.postgres.yaml up -d --build
services:
  splat:
    build: .
    image: ghcr.io/philippdormann/splat:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - splat-data:/data
    environment:
      SPLAT_PUBLIC_URL: ${SPLAT_PUBLIC_URL:-https://errors.example.com}
      SPLAT_ADMIN_USERNAME: ${SPLAT_ADMIN_USERNAME}
      SPLAT_ADMIN_PASSWORD: ${SPLAT_ADMIN_PASSWORD}
      SPLAT_SESSION_SECRET: ${SPLAT_SESSION_SECRET}
      SPLAT_DB_DRIVER: postgres
      SPLAT_DATABASE_URL: postgres://${POSTGRES_USER:-splat}:${POSTGRES_PASSWORD:-splat}@postgres:5432/${POSTGRES_DB:-splat}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/splat", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splat}
      POSTGRES_DB: ${POSTGRES_DB:-splat}
    volumes:
      # PG18+ stores data in versioned subdirectories, so the mount goes
      # on the parent dir (a 16-style /var/lib/postgresql/data mount is
      # refused at startup).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-splat} -d $${POSTGRES_DB:-splat}"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  splat-data:
  postgres-data:
