# Splat with the default SQLite backend: one container, one volume,
# nothing to provision.
#
#   cp .env.example .env   # set secrets + admin credentials
#   docker compose -f compose.sqlite.yaml up -d --build
services:
  splat:
    build: .
    image: ghcr.io/philippdormann/splat:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - splat-data:/data
    environment:
      SPLAT_PUBLIC_URL: ${SPLAT_PUBLIC_URL:-https://errors.example.com}
      SPLAT_ADMIN_USERNAME: ${SPLAT_ADMIN_USERNAME}
      SPLAT_ADMIN_PASSWORD: ${SPLAT_ADMIN_PASSWORD}
      SPLAT_SESSION_SECRET: ${SPLAT_SESSION_SECRET}
      SPLAT_DB_DRIVER: sqlite
      SPLAT_DB_PATH: /data/splat.db
    healthcheck:
      test: ["CMD", "/app/splat", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  splat-data:
