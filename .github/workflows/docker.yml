name: Docker image

# Runs the test suite, then builds the Docker image on every push. The
# image is only *pushed* to ghcr.io/philippdormann/splat on main/tags -
# PR builds still build (catching a broken Dockerfile early) but don't
# publish anything.
#
# Tagging:
#   main branch -> :latest + :sha-<short>
#   tag 1.2.3   -> :1.2.3 + :1.2 + :1 + :latest + :sha-<short> (never with "v" prefix)
on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: philippdormann/splat

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: |
          if [ -d frontend ]; then
            cd frontend && bun install --frozen-lockfile && bun run check && bun run build
          fi
      - run: |
          if [ -d frontend ]; then
            cd frontend && bun audit
          fi

  trivy-fs:
    # Dependency/license gate on the repo itself: fails the run on any
    # HIGH/CRITICAL CVE in Go modules or the bun lockfile.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan repo for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"

  trivy-image:
    # Same gate for the shipped image (base images included). Builds
    # amd64-only for speed; the multi-arch publish job stays unchanged.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: splat:trivy-scan
          build-args: |
            VERSION=ci-scan
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: splat:trivy-scan
          severity: HIGH,CRITICAL
          exit-code: "1"

  build-and-push:
    needs: [test, trivy-fs, trivy-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
