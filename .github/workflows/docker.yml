name: Docker image

# Tag-only releases: runs on version tags (e.g. 1.2.3), runs the test
# suite, then builds the multi-arch image and pushes it to
# ghcr.io/philippdormann/splat. Nothing runs on main pushes or PRs.
#
# Tagging:
#   tag 1.2.3 -> :1.2.3 + :1.2 + :1 + :latest + :sha-<short>
on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: philippdormann/splat

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cd frontend && bun install --frozen-lockfile && bun run check && bun run build
      - run: go test -race ./...
      - run: go vet ./...
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          repo-checkout: false
      - run: cd frontend && bun audit

  trivy-fs:
    # Dependency/license gate on the repo itself: fails the run on any
    # HIGH/CRITICAL CVE in Go modules or the bun lockfile.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan repo for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"

  build-and-push:
    # No QEMU: the Dockerfile builds the frontend and cross-compiles Go on
    # $BUILDPLATFORM, so both arches build natively on one runner.
    needs: [test, trivy-fs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-image:
    # Scans the pushed release image (no separate local build: the
    # build-and-push job already built it). Fails the run on any
    # HIGH/CRITICAL CVE, including base-image CVEs.
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"
