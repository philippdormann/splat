# Terminates TLS and proxies to splat. Obtain the certificate with
# certbot (certbot --nginx -d errors.example.com) or your preferred ACME client.
server {
    listen 443 ssl http2;
    server_name errors.example.com;

    ssl_certificate     /etc/letsencrypt/live/errors.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errors.example.com/privkey.pem;

    client_max_body_size 5m; # events can carry a sizeable stack trace + breadcrumbs

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name errors.example.com;
    return 301 https://$host$request_uri;
}
